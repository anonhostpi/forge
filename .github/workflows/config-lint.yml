name: config-lint
on:
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CONFIG_GATE: "1"          # in CI, a missing validator tool FAILS (never silently skips)
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml jsonschema
      - run: ./scripts/config-lint.sh
