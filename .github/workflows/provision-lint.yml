name: provision-lint
on:
  workflow_dispatch:
  pull_request:

jobs:
  render-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - run: ./scripts/render-selftest.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - run: ./actionlint

  security-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: provision.yml must keep the epic's decisive posture
        run: |
          set -euo pipefail
          f=.github/workflows/provision.yml
          ! grep -q 'toJson' "$f"                               || { echo "FAIL: uses toJson(secrets)"; exit 1; }
          ! grep -Eq 'pull_request_target|workflow_run' "$f"    || { echo "FAIL: forbidden trigger"; exit 1; }
          grep -q 'workflow_dispatch' "$f"                      || { echo "FAIL: not workflow_dispatch"; exit 1; }
          grep -q 'environment:' "$f"                           || { echo "FAIL: no environment"; exit 1; }
          ! grep -q 'AGE_KEY' "$f"                              || { echo "FAIL: provision references AGE_KEY (U4's, not U3's)"; exit 1; }
          echo "provision.yml security posture ok"
