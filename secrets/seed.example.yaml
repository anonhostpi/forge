# see anonhostpi/forge#2
# EXAMPLE shape for secrets/seed.sops.yaml — encrypt the real file with `sops -e`. Values are fake.
# `scope` is a DATA key U4 filters on (comments are invisible to yaml.safe_load): ci-only is NEVER
# rendered into a k8s Secret / mounted in-cluster; cluster is rendered + SSH-pushed to the box.
deploy_ssh:
  scope: ci-only
  private: replace-openssh-private-key
  user: root
forgejo:
  scope: cluster
  admin_user: forgejo-admin
  admin_email: admin@example.invalid
  admin_password: replace
  secret_key: replace
  internal_token: replace
  ssh_host_key: replace-openssh-host-key
  mailer_from: forgejo@example.invalid
  mailer_password: replace
postgres:
  scope: cluster
  app_password: replace
  superuser_password: replace
proton:
  scope: cluster
  username: replace
  bridge_password: replace
k3s:
  scope: cluster
  token: replace
