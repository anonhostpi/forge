# see anonhostpi/forge#2
# EXAMPLE shape for secrets/seed.sops.yaml — the real file is SOPS-encrypted (`sops -e`). Values are
# fake placeholders. `scope` tags are the contract U4 filters on: ci-only is NEVER rendered into a k8s
# Secret / never mounted in-cluster; cluster is rendered and SSH-pushed to the box.
deploy_ssh:            # scope: ci-only
  private: replace-openssh-private-key
  user: root
forgejo:               # scope: cluster
  admin_user: forgejo-admin
  admin_email: admin@example.invalid
  admin_password: replace
  secret_key: replace
  internal_token: replace
  ssh_host_key: replace-openssh-host-key
postgres:              # scope: cluster
  app_password: replace
  superuser_password: replace
proton:                # scope: cluster
  username: replace
  bridge_password: replace
k3s:                   # scope: cluster
  token: replace
