# see anonhostpi/forge#15 — TEMPLATE for Forgejo's creds Secret. The operator/CI `sops -e`'s this to
# deploy/manifests/forgejo.sops.yaml (which U4's deploy.sh decrypts + applies). Excluded from the deploy stream and
# from k8s-lint (*.example.yaml).
#
# `username` and `password` are named EXACTLY that because the chart's `gitea.admin.existingSecret` reads those two
# keys verbatim — naming them admin_user/admin_password makes admin creation SILENTLY no-op (review F3).
# NB: secrets.forgejo.ssh_host_key is NOT consumed — the chart's /data PVC already keeps the git-SSH host key stable
# across pod restarts, and mounting a read-only Secret over /data/ssh collides with Forgejo managing keys there
# (review F5). It is reserved for cross-REINSTALL reproducibility (subPath + defaultMode 0400), deferred.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo
  namespace: forge
type: Opaque
stringData:
  username: forgejo-admin
  password: replace-with-secrets.forgejo.admin_password
  secret_key: replace-with-secrets.forgejo.secret_key
  internal_token: replace-with-secrets.forgejo.internal_token
  mailer_password: replace-with-secrets.forgejo.mailer_password
