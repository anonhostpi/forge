# see anonhostpi/forge#14 — TEMPLATE for the creds Secret. The operator/CI `sops -e`'s this to
# deploy/manifests/postgres.sops.yaml (which U4's deploy.sh decrypts + applies). NEVER commit the plaintext values;
# NEVER put a `kind: Secret` in a plaintext deploy/manifests/*.yaml (k8s-lint forbids it — review F3).
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-postgres
  namespace: forge
type: Opaque
stringData:
  app_password: replace-with-secrets.postgres.app_password
  superuser_password: replace-with-secrets.postgres.superuser_password
